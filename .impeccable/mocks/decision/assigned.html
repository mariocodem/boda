<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
html,body{margin:0;height:100%}
body{width:390px;height:844px;overflow:hidden;background:#1d3a2e;font-family:Georgia,serif;position:relative}
.liner{position:absolute;inset:0;background:
radial-gradient(circle at 20px 20px,#f6f5f0 0 6px,transparent 7px) 0 0/60px 60px,
radial-gradient(circle at 50px 48px,#8fae9a 0 3px,transparent 4px) 0 0/60px 60px,#234536;opacity:.55}
.env{position:absolute;left:22px;right:22px;top:170px;height:420px;background:#1d3a2e;border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.flap{position:absolute;left:0;right:0;top:0;height:230px;background:#24473a;clip-path:polygon(0 0,100% 0,50% 100%);border-radius:6px 6px 0 0}
.seal{position:absolute;left:50%;top:200px;width:64px;height:64px;margin-left:-32px;border-radius:50%;background:#f6f5f0;color:#1d3a2e;font-size:26px;display:grid;place-items:center}
.stamp{position:absolute;right:18px;top:18px;width:62px;height:76px;background:#f6f5f0;outline:3px dotted #f6f5f0;outline-offset:2px}
.to{position:absolute;left:28px;bottom:40px;color:#f6f5f0}
.to b{display:block;font-style:italic;font-weight:400;font-size:40px;line-height:1}
.to span{font-size:14px;letter-spacing:.2em}
.k{position:absolute;top:70px;left:0;right:0;text-align:center;color:#f6f5f0;font-size:13px;letter-spacing:.3em}
.n{position:absolute;top:96px;left:0;right:0;text-align:center;color:#f6f5f0;font-size:34px}
.cta{position:absolute;bottom:120px;left:0;right:0;text-align:center}
.cta i{display:inline-block;padding:16px 28px;border-radius:40px;background:#d99a1e;color:#14231c;font-style:normal;font-size:24px}
</style></head><body><div class="liner"></div>
<div class="k">SOBRE N.º 027</div><div class="n">Diego &amp; Erika</div>
<div class="env"><div class="flap"></div><div class="seal">D·E</div><div class="stamp"></div>
<div class="to"><b>Familia Rodríguez</b><span>4 CUPOS</span></div></div>
<div class="cta"><i>Toca para abrir</i></div></body></html>
